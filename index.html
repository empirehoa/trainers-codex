<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trainer's Codex — Pokémon Team Builder & Coverage Analyzer</title>
    <meta name="description" content="Build, analyze, and share Pokémon teams across 1,300+ entries — every form, every Mega, every regional variant. Instant type-coverage analysis, threat detection, AI-suggested counter teams, 12 poster styles, and print-on-demand merch." />
    <meta name="theme-color" content="#0c0a08" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="Trainer's Codex" />
    <meta property="og:description" content="Pokémon team builder with instant analysis, threat detection, and counter teams." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trainerscodex.com/" />
    <meta property="og:site_name" content="Trainer's Codex" />

    <!--
      Journey Mode share card. The bundle is one static document served at both
      / and /journey, so these tags are shared by both routes — a per-run OG
      image would need a server to render per-seed and is explicitly out of
      scope for v1 (the playable ?seed= deep-link carries the per-run payload
      instead). The Journey card is the more shareable of the two surfaces, so
      it gets the image.

      The copy here omits the word "Pokémon" on purpose. Route copy, page
      title, and OG tags are all inside the pre-launch IP counsel review, and
      Journey Mode is built for peak visibility during Worlds week. Regenerate
      public/og-journey.jpg via `node scripts/make-og-image.mjs` if that copy
      changes.
    -->
    <meta property="og:image" content="https://trainerscodex.com/og-journey.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trainer's Codex — live an entire trainer career in three minutes." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trainer's Codex — Journey Mode" />
    <meta name="twitter:description" content="Live an entire trainer career in three minutes. Choose your path, retire, and share your Legend Card." />
    <meta name="twitter:image" content="https://trainerscodex.com/og-journey.jpg" />

    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0a08'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f4ae3c' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23f4ae3c' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f4ae3c'/%3E%3C/svg%3E" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Trainer's Codex",
      "applicationCategory": "GameApplication",
      "operatingSystem": "All",
      "description": "Pokemon team builder with type coverage analysis, threat detection, and counter team suggestions.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <style>
      html, body { margin: 0; padding: 0; background: #0c0a08; color: #f5ead2; font-family: ui-monospace, 'JetBrains Mono', monospace; }
      #root:empty::before {
        content: '// initializing trainer\27s codex...';
        display: block;
        padding: 2rem;
        font-size: 11px;
        color: #f4ae3c;
        letter-spacing: 0.05em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
